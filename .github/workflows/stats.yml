# Rewrites the stats sentence in README.md once a day.
name: Update stats

on:
  schedule:
    - cron: "15 0 * * *"   # daily, just after the snake refreshes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate stats sentence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update profile stats"
          git push
