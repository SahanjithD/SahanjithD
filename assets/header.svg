<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220"
     role="img" aria-label="Dasun Deshaja — Computer Engineering undergraduate, Integration AI team at WSO2">
  <title>Dasun Deshaja — Computer Engineering undergraduate, Integration AI team at WSO2</title>

  <defs>
    <!-- Deep backdrop the glass sits on -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#070B16"/>
      <stop offset="55%"  stop-color="#101A38"/>
      <stop offset="100%" stop-color="#070B16"/>
    </linearGradient>

    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".80"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <!-- Drifting colour field. Refracted by the glass above it. -->
    <g id="field">
      <rect width="1000" height="220" fill="url(#bg)"/>
      <g>
        <ellipse cx="210" cy="90" rx="260" ry="150" fill="url(#b1)">
          <animateTransform attributeName="transform" type="translate"
            values="0 0; 90 26; -34 14; 0 0" dur="19s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="640" cy="170" rx="250" ry="140" fill="url(#b2)">
          <animateTransform attributeName="transform" type="translate"
            values="0 0; -74 -32; 46 -12; 0 0" dur="23s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="880" cy="60" rx="230" ry="130" fill="url(#b3)">
          <animateTransform attributeName="transform" type="translate"
            values="0 0; -52 40; 30 -22; 0 0" dur="27s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>

    <!-- Refraction: warp the field, then frost it. This is the glass. -->
    <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.016"
                    numOctaves="2" seed="11" result="noise">
        <animate attributeName="baseFrequency"
          values="0.010 0.016; 0.015 0.011; 0.010 0.016"
          dur="24s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="26"
                         xChannelSelector="R" yChannelSelector="G" result="warp"/>
      <feGaussianBlur in="warp" stdDeviation="14"/>
    </filter>

    <!-- Panel geometry, reused as clip and as stroke -->
    <rect id="shape" x="26" y="26" width="948" height="168" rx="30"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>

    <!-- Specular sheen across the top-left of the pane -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="42%"  stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".32"/>
    </linearGradient>
  </defs>

  <!-- 1. the field itself -->
  <use href="#field"/>

  <!-- 2. the same field, warped and frosted, seen only through the pane -->
  <g clip-path="url(#clip)">
    <use href="#field" filter="url(#liquid)"/>
    <use href="#shape" fill="#FFFFFF" fill-opacity=".10"/>
    <use href="#shape" fill="url(#sheen)"/>
  </g>

  <!-- 3. the lit rim -->
  <use href="#shape" fill="none" stroke="url(#edge)" stroke-width="1.25"/>

  <!-- 4. content -->
  <g font-family="SF Pro Display,-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">
    <text x="64" y="104" font-size="40" font-weight="600" fill="#F0F6FC"
          letter-spacing="-0.5">Dasun Deshaja</text>
    <text x="64" y="140" font-size="16.5" font-weight="400" fill="#AEBBD0" letter-spacing="0.2">
      Computer Engineering undergraduate · Integration AI team @ WSO2
    </text>
    <rect x="64" y="158" width="52" height="2.5" rx="1.25" fill="#58A6FF" fill-opacity=".9"/>
  </g>
</svg>
