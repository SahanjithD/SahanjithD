<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250"
     role="img" aria-label="GitHub activity for SahanjithD: 405 commits, 84 pull requests, 15 issues across 19 repositories">
  <title>GitHub activity for SahanjithD</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B16"/><stop offset="55%" stop-color="#101A38"/>
      <stop offset="100%" stop-color="#070B16"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0%" stop-color="#1F6FEB" stop-opacity=".9"/><stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0%" stop-color="#22D3EE" stop-opacity=".7"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0%" stop-color="#A78BFA" stop-opacity=".7"/><stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>

    <g id="field">
      <rect width="1000" height="250" fill="url(#bg)"/>
      <ellipse cx="180" cy="210" rx="250" ry="150" fill="url(#g1)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 80 -30; -30 -12; 0 0" dur="21s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="620" cy="30" rx="240" ry="140" fill="url(#g2)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -70 36; 40 14; 0 0" dur="25s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="900" cy="200" rx="230" ry="140" fill="url(#g3)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -48 -40; 26 20; 0 0" dur="29s" repeatCount="indefinite"/></ellipse>
    </g>

    <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.016" numOctaves="2" seed="5" result="n">
        <animate attributeName="baseFrequency" values="0.010 0.016; 0.015 0.011; 0.010 0.016"
                 dur="26s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G" result="w"/>
      <feGaussianBlur in="w" stdDeviation="14"/>
    </filter>

    <rect id="shape" x="26" y="26" width="948" height="198" rx="30"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".20"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".3"/>
    </linearGradient>
  </defs>

  <use href="#field"/>
  <g clip-path="url(#clip)">
    <use href="#field" filter="url(#liquid)"/>
    <use href="#shape" fill="#FFFFFF" fill-opacity=".10"/>
    <use href="#shape" fill="url(#sheen)"/>
  </g>
  <use href="#shape" fill="none" stroke="url(#edge)" stroke-width="1.25"/>

  <g font-family="SF Pro Display,-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">
    <text x="64" y="68" font-size="11" font-weight="500" fill="#8B9BB4" letter-spacing="1.4">GITHUB ACTIVITY</text>
    <text x="936" y="68" font-size="10.5" fill="#60728F" text-anchor="end">updated 22 Oct 2026</text>
    <text x="64" y="118" font-size="34" font-weight="600" fill="#F0F6FC" letter-spacing="-0.5">405</text><text x="64" y="140" font-size="9.5" font-weight="500" fill="#8B9BB4" letter-spacing="1.1">COMMITS</text>
    <text x="246" y="118" font-size="34" font-weight="600" fill="#F0F6FC" letter-spacing="-0.5">84</text><text x="246" y="140" font-size="9.5" font-weight="500" fill="#8B9BB4" letter-spacing="1.1">PULL REQUESTS · 54 MERGED</text>
    <text x="452" y="118" font-size="34" font-weight="600" fill="#F0F6FC" letter-spacing="-0.5">15</text><text x="452" y="140" font-size="9.5" font-weight="500" fill="#8B9BB4" letter-spacing="1.1">ISSUES</text>
    <text x="634" y="118" font-size="34" font-weight="600" fill="#F0F6FC" letter-spacing="-0.5">19</text><text x="634" y="140" font-size="9.5" font-weight="500" fill="#8B9BB4" letter-spacing="1.1">REPOSITORIES</text>
    <text x="816" y="118" font-size="34" font-weight="600" fill="#F0F6FC" letter-spacing="-0.5">16</text><text x="816" y="140" font-size="9.5" font-weight="500" fill="#8B9BB4" letter-spacing="1.1">CONTRIBUTED TO</text>
    <g clip-path="url(#clip)">
      <rect x="64" y="178" width="872" height="9" rx="4.5" fill="#FFFFFF" fill-opacity=".07"/>
      <g clip-path="url(#barclip)"><rect x="64.0" y="178" width="350.7" height="9" fill="#FF5000"/>
    <rect x="414.7" y="178" width="250.6" height="9" fill="#3178C6"/>
    <rect x="665.4" y="178" width="182.9" height="9" fill="#3572A5"/>
    <rect x="848.3" y="178" width="73.1" height="9" fill="#F1E05A"/>
    <rect x="921.3" y="178" width="14.7" height="9" fill="#178600"/></g>
    </g>
    <circle cx="64" cy="209" r="3.5" fill="#FF5000"/><text x="75" y="213" font-size="11.5" fill="#AEBBD0">Ballerina <tspan fill="#6E7F99">40.2%</tspan></text>
    <circle cx="191" cy="209" r="3.5" fill="#3178C6"/><text x="202" y="213" font-size="11.5" fill="#AEBBD0">TypeScript <tspan fill="#6E7F99">28.7%</tspan></text>
    <circle cx="325" cy="209" r="3.5" fill="#3572A5"/><text x="336" y="213" font-size="11.5" fill="#AEBBD0">Python <tspan fill="#6E7F99">21.0%</tspan></text>
    <circle cx="431" cy="209" r="3.5" fill="#F1E05A"/><text x="442" y="213" font-size="11.5" fill="#AEBBD0">JavaScript <tspan fill="#6E7F99">8.4%</tspan></text>
    <circle cx="565" cy="209" r="3.5" fill="#178600"/><text x="576" y="213" font-size="11.5" fill="#AEBBD0">C# <tspan fill="#6E7F99">1.7%</tspan></text>
  </g>
  <defs><clipPath id="barclip"><rect x="64" y="178" width="872" height="9" rx="4.5"/></clipPath></defs>
